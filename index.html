<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>驾驶员疲劳状态检测系统</title>
  <style>
    :root {
      --bg: #f1f2f3;
      --card: #fff;
      --line: #d9d9d9;
      --text: #1e1e1e;
      --muted: #666;
      --primary: #2e9de8;
      --purple: #8e44ad;
      --shadow: 0 1px 6px rgba(0,0,0,.08);
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 14px 16px 16px;
      gap: 12px;
    }

    .topbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 50px;
      padding: 0 190px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      border-bottom: 1px solid #d0d0d0;
      background: rgba(255,255,255,0.7);
      border-radius: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,.05);
    }

    .platform-link {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      height: 34px;
      padding: 0 14px;
      border: 1px solid #238ed1;
      border-radius: 8px;
      background: linear-gradient(135deg, #38a8ee, #237fc2);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .2px;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(46,157,232,.25);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }

    .platform-link:hover {
      transform: translateY(-50%) translateY(-1px);
      box-shadow: 0 6px 14px rgba(46,157,232,.32);
      filter: brightness(1.04);
    }

    .platform-link:active {
      transform: translateY(-50%);
    }

    .platform-link:focus-visible {
      outline: 3px solid rgba(46,157,232,.28);
      outline-offset: 2px;
    }

    .platform-link::after {
      content: "↗";
      margin-left: 7px;
      font-size: 14px;
      line-height: 1;
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 2.3fr) minmax(360px, 1fr);
      gap: 14px;
      min-height: 0;
    }

    .left {
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .right-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(285px, auto) minmax(180px, 1fr) minmax(240px, 1.3fr) auto;
      gap: 12px;
      overflow: hidden;
    }

    .wave-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 10px 14px 12px;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .wave-title {
      text-align: left;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #111;
      letter-spacing: .5px;
      padding-left: 4px;
      border-left: 4px solid #2e9de8;
    }

    .chart-wrap {
      position: relative;
      flex: 1;
      min-height: 170px;
      border: 1px solid #d6d6d6;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .chart-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, rgba(0,0,0,0.045) 1px, transparent 1px) 0 0 / 12px 12px,
        linear-gradient(to bottom, rgba(0,0,0,0.045) 1px, transparent 1px) 0 0 / 12px 12px,
        linear-gradient(to right, rgba(190,0,0,0.08) 1px, transparent 1px) 0 0 / 60px 60px,
        linear-gradient(to bottom, rgba(190,0,0,0.08) 1px, transparent 1px) 0 0 / 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    canvas,
    .placeholder {
      position: relative;
      z-index: 1;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 13px;
      pointer-events: none;
    }

    .box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .control-box {
      padding: 10px 12px;
      gap: 8px;
    }

    .split {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      margin-bottom: 0;
      min-width: 0;
    }

    .small-label {
      font-size: 13px;
      font-weight: 700;
      color: #222;
      white-space: nowrap;
    }

    select, input[type="file"] {
      width: 100%;
      min-width: 0;
      border: 1px solid #aaa;
      border-radius: 6px;
      height: 32px;
      background: #fff;
      font-size: 12px;
      padding: 4px 8px;
      outline: none;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hint {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.45;
      margin-top: 2px;
      padding-top: 8px;
      border-top: 1px dashed #ddd;
      flex: 1;
      min-height: 0;
      overflow: auto;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .hint b {
      color: #333;
      font-weight: 700;
    }

    .hint-line {
      display: block;
      margin-bottom: 4px;
    }

    .hint-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 6px;
      margin: 2px 0 5px;
    }

    .hint-chip {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      padding: 2px 6px;
      border: 1px solid #d7e7f5;
      border-radius: 999px;
      background: #f5faff;
      color: #285c82;
      font-weight: 700;
      white-space: nowrap;
    }

    .device-panel {
      padding-top: 8px;
      border-top: 1px dashed #ddd;
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .device-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .device-title {
      font-size: 12px;
      font-weight: 800;
      color: #263238;
      white-space: nowrap;
    }

    .device-support {
      min-width: 0;
      color: #718087;
      font-size: 10.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .device-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px;
      gap: 7px;
      min-width: 0;
    }

    .device-select {
      width: 100%;
      min-width: 0;
      height: 34px;
      border: 1px solid #aab8be;
      border-radius: 7px;
      background: #fff;
      padding: 4px 8px;
      color: #263238;
      font-size: 11.5px;
      outline: none;
      text-overflow: ellipsis;
    }

    .device-select:focus {
      border-color: #2298d2;
      box-shadow: 0 0 0 3px rgba(34,152,210,.12);
    }

    .btn-device {
      height: 34px;
      border: 1px solid #376d92;
      border-radius: 7px;
      background: linear-gradient(135deg, #568eb6, #376d92);
      color: #fff;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 7px rgba(55,109,146,.18);
    }

    .btn-device:hover {
      filter: brightness(1.05);
    }

    .btn-device:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .computer-info {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
      min-width: 0;
    }

    .computer-info-item {
      min-width: 0;
      padding: 5px 6px;
      border: 1px solid #dce5e9;
      border-radius: 7px;
      background: #f8fbfc;
    }

    .computer-info-name {
      color: #7a888e;
      font-size: 9.5px;
      line-height: 1.1;
      margin-bottom: 2px;
    }

    .computer-info-value {
      color: #263238;
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .device-message {
      min-height: 18px;
      padding: 3px 6px;
      border-radius: 6px;
      background: #f4f7f8;
      color: #62737a;
      font-size: 10.5px;
      line-height: 1.3;
      word-break: break-word;
    }

    .device-message.success {
      color: #216b25;
      background: #edf8ef;
    }

    .device-message.warning {
      color: #8a5600;
      background: #fff8e6;
    }

    .device-message.error {
      color: #a40018;
      background: #fff0f1;
    }

    .radar-capture {
      display: grid;
      grid-template-columns: minmax(150px, 0.88fr) minmax(0, 1.12fr);
      gap: 9px;
      align-items: stretch;
      padding-top: 8px;
      border-top: 1px dashed #ddd;
      min-width: 0;
    }

    .btn-radar {
      position: relative;
      height: 42px;
      border: 1px solid #078b91;
      background: linear-gradient(135deg, #16a7ae, #087f91);
      overflow: hidden;
    }

    .btn-radar::before {
      content: "";
      width: 8px;
      height: 8px;
      margin-right: 7px;
      display: inline-block;
      border-radius: 50%;
      background: #d9ffff;
      box-shadow:
        0 0 0 4px rgba(217,255,255,.18),
        0 0 12px rgba(217,255,255,.72);
      vertical-align: middle;
    }

    .btn-radar.collecting::before {
      animation: radarPulse 1s ease-in-out infinite;
    }

    .btn-radar.complete {
      border-color: #218838;
      background: linear-gradient(135deg, #35b65a, #218838);
    }

    .radar-status {
      min-width: 0;
      height: 42px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5px 9px;
      border: 1px solid #c9d8de;
      border-radius: 8px;
      background: #f7fbfc;
      color: #47616b;
      overflow: hidden;
    }

    .radar-status-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.2;
    }

    .radar-status-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .radar-countdown {
      flex: 0 0 auto;
      color: #087f91;
      font-size: 13px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .radar-progress-track {
      width: 100%;
      height: 5px;
      margin-top: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: #dfeaec;
    }

    .radar-progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #16a7ae, #087f91);
      transition: width .25s linear;
    }

    .radar-status.collecting {
      border-color: #79c9cd;
      background: #effcfc;
    }

    .radar-status.collecting .radar-progress-bar {
      width: 34% !important;
      animation: radarScanning 1.45s ease-in-out infinite;
    }

    .radar-status.complete {
      border-color: #9bd4a8;
      background: #f0fbf3;
      color: #246b34;
    }

    .radar-status.complete .radar-countdown {
      color: #218838;
    }

    .radar-status.complete .radar-progress-bar {
      background: linear-gradient(90deg, #35b65a, #218838);
    }

    @keyframes radarPulse {
      0%, 100% {
        transform: scale(.88);
        opacity: .72;
      }
      50% {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    @keyframes radarScanning {
      0% {
        transform: translateX(-120%);
      }
      50% {
        transform: translateX(95%);
      }
      100% {
        transform: translateX(300%);
      }
    }

    .logbox {
      flex: 1;
      min-height: 0;
      overflow: auto;
      font-size: 13px;
      line-height: 1.65;
      color: #222;
      border: 1px solid #aaa;
      border-radius: 8px;
      padding: 10px;
      white-space: pre-line;
      background: #fafafa;
    }

    .progress-wrap { margin-top: 10px; }

    .progress-track {
      width: 100%;
      height: 16px;
      border-radius: 8px;
      background: #e1e1e1;
      overflow: hidden;
      position: relative;
      border: 1px solid #bcbcbc;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2db84d, #1e9d38);
      transition: width .08s linear;
    }

    .progress-text {
      position: absolute;
      right: 8px;
      top: -1px;
      font-size: 12px;
      color: #444;
      line-height: 16px;
    }

    .result-box {
      flex: 1;
      min-height: 0;
      max-height: 100%;
      overflow: auto;
      border: 1px solid #b5b5b5;
      border-radius: 8px;
      background: #fff;
      padding: 10px;
      font-size: 13px;
      line-height: 1.45;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
    }

    .status-pill.good {
      color: #216b25;
      background: #e8f6e8;
      border: 1px solid #b9dfbc;
    }

    .status-pill.bad {
      color: #a40018;
      background: #ffe3e3;
      border: 1px solid #e7a1a1;
    }

    .confidence {
      color: #444;
      font-size: 12px;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    .confidence-note {
      display: block;
      margin-top: 2px;
      color: #777;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.25;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 8px;
    }

    .metric-item {
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 7px;
      background: rgba(255,255,255,.72);
      padding: 6px 7px;
      min-width: 0;
    }

    .metric-name {
      color: #666;
      font-size: 11px;
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .metric-value {
      color: #111;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.25;
    }

    .result-reason,
    .result-advice,
    .result-note {
      border-top: 1px dashed rgba(0,0,0,.12);
      padding-top: 7px;
      margin-top: 7px;
      font-size: 12px;
      line-height: 1.55;
    }

    .result-reason b { color: #333; }

    .result-advice { font-weight: 700; }
    .result-note { color: #6a4d00; }

    .result-box.normal {
      color: #2a7a2a;
      background: #f4fbf4;
    }

    .result-box.fatigue {
      color: #a40018;
      background: #ffecec;
      border-color: #d64545;
      box-shadow:
        0 0 0 2px rgba(235,77,75,.10) inset,
        0 0 12px rgba(235,77,75,.12);
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .btn {
      height: 44px;
      border: none;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform .08s ease, opacity .2s ease;
    }

    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .btn-start { background: var(--primary); }
    .btn-reset { background: #f04e3a; }
    .btn-refresh { background: var(--purple); }

    .app.alert {
      background: linear-gradient(135deg, #b8001b 0%, #d6001c 34%, #ffe5e5 100%);
      color: #3b0008;
      position: relative;
    }

    .app.alert::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,.24), transparent 28%),
        linear-gradient(180deg, rgba(255,0,32,.18), rgba(100,0,14,.08));
      z-index: 0;
    }

    .app.alert > * {
      position: relative;
      z-index: 1;
    }

    .app.alert .topbar {
      color: #fff;
      background: linear-gradient(90deg, #970014, #d6001c, #970014);
      border: 1px solid rgba(255,255,255,.35);
      box-shadow: 0 0 0 2px rgba(255,255,255,.12) inset, 0 8px 24px rgba(86,0,12,.28);
    }

    .app.alert .topbar::before {
      content: "⚠ ";
      font-size: 20px;
      margin-right: 6px;
    }

    .app.alert .platform-link {
      color: #8f0013;
      background: #fff;
      border-color: rgba(255,255,255,.85);
      box-shadow: 0 4px 14px rgba(82,0,11,.24);
    }

    .app.alert .platform-link:hover {
      box-shadow: 0 7px 18px rgba(82,0,11,.30);
    }

    .app.alert .wave-card,
    .app.alert .box {
      background: rgba(255, 236, 236, .96);
      border-color: rgba(160, 0, 22, .68);
      box-shadow: 0 0 0 2px rgba(214,0,28,.12) inset, 0 8px 26px rgba(90,0,14,.22);
    }

    .app.alert .wave-title,
    .app.alert .small-label {
      color: #8f0013;
    }

    .app.alert .wave-title {
      border-left-color: #d6001c;
    }

    .app.alert .chart-wrap,
    .app.alert .logbox,
    .app.alert .result-box {
      background: #fff7f7;
      border-color: rgba(180,0,24,.62);
    }

    .app.alert .chart-wrap::before {
      background:
        linear-gradient(to right, rgba(160,0,24,0.075) 1px, transparent 1px) 0 0 / 12px 12px,
        linear-gradient(to bottom, rgba(160,0,24,0.075) 1px, transparent 1px) 0 0 / 12px 12px,
        linear-gradient(to right, rgba(214,0,28,0.16) 1px, transparent 1px) 0 0 / 60px 60px,
        linear-gradient(to bottom, rgba(214,0,28,0.16) 1px, transparent 1px) 0 0 / 60px 60px;
    }

    .app.alert .logbox {
      color: #64000c;
    }

    .app.alert .result-box.fatigue {
      color: #7d0011;
      background: #fff2f2;
      border-color: #b8001b;
      box-shadow: 0 0 0 2px rgba(214,0,28,.18) inset, 0 0 18px rgba(214,0,28,.22);
    }

    .app.alert .status-pill.bad {
      color: #fff;
      background: #d6001c;
      border-color: #a40018;
    }

    .app.alert .result-advice {
      color: #9c0015;
    }

    .app.alert .device-panel {
      border-top-color: rgba(160,0,22,.25);
    }

    .app.alert .device-title {
      color: #72000f;
    }

    .app.alert .device-select,
    .app.alert .device-message {
      background: #fff8f8;
      border-color: rgba(180,0,24,.28);
    }

    .app.alert .btn-device {
      border-color: #850012;
      background: linear-gradient(135deg, #c94859, #980015);
    }

    .app.alert .radar-status {
      background: #fff7f7;
      border-color: rgba(180,0,24,.45);
      color: #72000f;
    }

    .app.alert .radar-countdown {
      color: #a40018;
    }

    .app.alert .radar-progress-track {
      background: #f1cdd2;
    }

    .app.alert .radar-progress-bar {
      background: linear-gradient(90deg, #ee596d, #b8001b);
    }

    .app.alert .btn-radar {
      border-color: #850012;
      background: linear-gradient(135deg, #d8394f, #980015);
    }

    .app.alert .btn-radar.complete {
      border-color: #218838;
      background: linear-gradient(135deg, #35b65a, #218838);
    }

    @media (max-width: 1100px) {
      body { overflow: auto; }
      .topbar {
        min-height: 58px;
        height: auto;
        padding: 10px 176px 10px 16px;
        justify-content: flex-start;
        text-align: left;
        font-size: 18px;
      }
      .platform-link {
        right: 10px;
        min-width: 148px;
      }
      .app { height: auto; min-height: 100vh; }
      .main { grid-template-columns: 1fr; }
      .left { grid-template-rows: auto; }
      .right-panel { grid-template-rows: auto; overflow: visible; }
      .control-box { min-height: 0; }
      .hint { max-height: none; overflow: visible; }
      .result-box { max-height: 360px; }
      .device-controls { grid-template-columns: 1fr; }
      .radar-capture { grid-template-columns: 1fr; }
      .radar-status { height: 44px; }
      .button-row { margin-top: 10px; }
    }

    @media (max-width: 680px) {
      .topbar {
        padding: 10px 12px;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        text-align: center;
      }

      .platform-link {
        position: static;
        transform: none;
        width: min(100%, 240px);
      }

      .platform-link:hover,
      .platform-link:active {
        transform: none;
      }
    }

  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="topbar">
      <span>驾驶员疲劳状态检测系统</span>
      <a
        class="platform-link"
        href="https://kycloud.psychtech.cn/index"
        target="_blank"
        rel="noopener noreferrer"
        title="在新标签页打开外部网页"
      >打开测评平台</a>
    </div>

    <div class="main">
      <div class="left">
        <div class="wave-card">
          <div class="wave-title">呼吸波形图</div>
          <div class="chart-wrap">
            <canvas id="canvas1"></canvas>
            <div class="placeholder" id="ph1">等待检测开始后显示波形</div>
          </div>
        </div>

        <div class="wave-card">
          <div class="wave-title">心率波形图</div>
          <div class="chart-wrap">
            <canvas id="canvas2"></canvas>
            <div class="placeholder" id="ph2">等待检测开始后显示波形</div>
          </div>
        </div>

        <div class="wave-card">
          <div class="wave-title">RR 间隔波形图</div>
          <div class="chart-wrap">
            <canvas id="canvas3"></canvas>
            <div class="placeholder" id="ph3">等待检测开始后显示波形</div>
          </div>
        </div>
      </div>

      <div class="right-panel">
        <div class="box control-box">
          <div class="split">
            <div class="small-label">选择模型：</div>
            <select id="modelSelect">
              <option value="LM2F-FD2M.pt">LM2F-FD2M.pt</option>
              <option value="MFA-BiGRU.pt">MFA-BiGRU.pt</option>
            </select>
          </div>

          <div class="split">
            <div class="small-label">上传 CSV：</div>
            <input id="fileInput" type="file" accept=".csv" />
          </div>

          <div class="device-panel">
            <div class="device-title-row">
              <span class="device-title">采集设备</span>
              <span class="device-support" id="deviceSupportText">正在检查USB设备访问能力...</span>
            </div>

            <div class="device-controls">
              <select class="device-select" id="deviceSelect" aria-label="选择采集设备">
                <option value="local">本机模拟采集（未连接硬件）</option>
              </select>
              <button class="btn-device" id="chooseDeviceBtn" type="button">选择USB设备</button>
            </div>

            <div class="device-message" id="deviceMessage">
              当前使用本机模拟采集。连接毫米波雷达后，请点击“选择USB设备”。
            </div>
          </div>

          <div class="radar-capture">
            <button class="btn btn-radar" id="radarCaptureBtn" type="button">开始毫米波雷达信号采集</button>
            <div class="radar-status" id="radarStatus" aria-live="polite">
              <div class="radar-status-main">
                <span class="radar-status-text" id="radarStatusText">等待开始采集</span>
                <span class="radar-countdown" id="radarCountdown">00:00</span>
              </div>
              <div class="radar-progress-track">
                <div class="radar-progress-bar" id="radarProgressBar"></div>
              </div>
            </div>
          </div>

          <div class="hint">
            <span class="hint-line">支持 CSV 文件，自动识别以下生理数据列：</span>
            <span class="hint-chips">
              <span class="hint-chip">HR_PPG / 心率</span>
              <span class="hint-chip">IBI_PPG / RR间隔</span>
              <span class="hint-chip">Resp / 呼吸信号</span>
              <span class="hint-chip">PPG / BVP</span>
            </span>
            <span class="hint-line"></span>
          </div>
        </div>

        <div class="box">
          <div class="small-label" style="margin-bottom:8px;">处理状态：</div>
          <div class="logbox" id="logBox">请先选择模型并上传 CSV 文件，然后点击“开始检测”。</div>

          <div class="progress-wrap">
            <div class="progress-track">
              <div class="progress-bar" id="progressBar"></div>
              <div class="progress-text" id="progressText">0%</div>
            </div>
          </div>
        </div>

        <div class="box">
          <div class="small-label" style="margin-bottom:8px;">检测结论：</div>
          <div class="result-box" id="resultBox">等待检测结果...</div>
        </div>

        <div class="button-row">
          <button class="btn btn-start" id="startBtn">开始检测</button>
          <button class="btn btn-reset" id="resetBtn">重新检测</button>
          <button class="btn btn-refresh" id="refreshBtn">刷新波形图</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const app = document.getElementById('app');
    const modelSelect = document.getElementById('modelSelect');
    const fileInput = document.getElementById('fileInput');
    const logBox = document.getElementById('logBox');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const resultBox = document.getElementById('resultBox');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const radarCaptureBtn = document.getElementById('radarCaptureBtn');
    const radarStatus = document.getElementById('radarStatus');
    const radarStatusText = document.getElementById('radarStatusText');
    const radarCountdown = document.getElementById('radarCountdown');
    const radarProgressBar = document.getElementById('radarProgressBar');
    const deviceSelect = document.getElementById('deviceSelect');
    const chooseDeviceBtn = document.getElementById('chooseDeviceBtn');
    const deviceSupportText = document.getElementById('deviceSupportText');
    const deviceMessage = document.getElementById('deviceMessage');
    const ph1 = document.getElementById('ph1');
    const ph2 = document.getElementById('ph2');
    const ph3 = document.getElementById('ph3');

    const canvas1 = document.getElementById('canvas1');
    const canvas2 = document.getElementById('canvas2');
    const canvas3 = document.getElementById('canvas3');
    const canvases = [canvas1, canvas2, canvas3];

    const DETECT_DURATION = 20000;
    const WAVE_DELAY = 5000;
    const WAVE_REVEAL_DURATION = 3500;
    const SCROLL_SPEED = 120;
    const DEFAULT_RAW_PPG_FS = 64;
    const WINDOW_SECONDS = 60;
    const STEP_SECONDS = 1;
    const DISPLAY_POINTS = 1200;

    let progressTimer = null;
    let finalTimer = null;
    let revealTimer = null;
    let waveTimer = null;
    let radarCaptureTimer = null;
    let radarCaptureRunning = false;
    let radarCaptureFinished = false;
    let radarCaptureStartTime = 0;
    let radarElapsedSeconds = 0;

    let selectedUsbDevice = null;
    let authorizedUsbDevices = [];
    let selectedDeviceMode = 'local';

    let animId = null;
    let lastAnimTime = 0;
    let scrollAcc = 0;

    let detectionRunning = false;
    let showWaveforms = false;
    let frameIndex = 0;
    let waveReveal = 0;
    let currentSeed = 123456;
    let currentStage = 'running';
    let waveformData = { breathing: [], heart: [], rr: [] };
    let rawCsvData = emptyRawData();

    function emptyRawData() {
      return {
        heart: [],
        rr: [],
        breathing: [],
        sdnn: [],
        rmssd: [],
        pnn50: [],
        quality: [],
        timestamps: [],
        rawPPG: [],
        sourceColumns: {},
        derivedFlags: { sdnn: false, rmssd: false, quality: false, breathingRelative: false },
        rowCount: 0,
        mode: 'none'
      };
    }

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return Math.abs(h >>> 0);
    }

    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function resizeCanvas(canvas) {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function resizeAll() {
      canvases.forEach(resizeCanvas);
      if (showWaveforms) drawAll();
    }

    window.addEventListener('resize', resizeAll);

    function setLogs(lines) {
      logBox.textContent = lines.join('\n');
      logBox.scrollTop = logBox.scrollHeight;
    }

    function appendLog(line) {
      logBox.textContent += (logBox.textContent.endsWith('\n') ? '' : '\n') + line;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setProgress(v) {
      const p = clamp(v, 0, 100);
      progressBar.style.width = p + '%';
      progressText.textContent = p + '%';
    }

    function setDeviceMessage(text, type = '') {
      deviceMessage.classList.remove('success', 'warning', 'error');
      if (type) deviceMessage.classList.add(type);
      deviceMessage.textContent = text;
    }

    function initUsbSupport() {
      if ('usb' in navigator) {
        deviceSupportText.textContent = '支持USB设备授权选择';
        chooseDeviceBtn.disabled = false;
      } else {
        deviceSupportText.textContent = '当前浏览器不支持WebUSB';
        chooseDeviceBtn.disabled = true;
        setDeviceMessage(
          '当前浏览器无法直接选择USB设备。可继续使用本机模拟采集，或改用支持WebUSB的桌面浏览器。',
          'warning'
        );
      }
    }

    function usbHex(value, width = 4) {
      if (!Number.isFinite(value)) return '';
      return Number(value).toString(16).toUpperCase().padStart(width, '0');
    }

    function usbDeviceLabel(device, index = 0) {
      const productName = device?.productName?.trim();
      const manufacturerName = device?.manufacturerName?.trim();
      const vid = Number.isFinite(device?.vendorId) ? `VID:${usbHex(device.vendorId)}` : '';
      const pid = Number.isFinite(device?.productId) ? `PID:${usbHex(device.productId)}` : '';
      const ids = [vid, pid].filter(Boolean).join(' ');

      const name = [manufacturerName, productName].filter(Boolean).join(' ');
      if (name && ids) return `${name} (${ids})`;
      if (name) return name;
      if (ids) return `USB毫米波雷达 ${ids}`;
      return `已授权USB设备 ${index + 1}`;
    }

    function rebuildDeviceOptions(preferredDevice = null) {
      const previousValue = deviceSelect.value;
      deviceSelect.innerHTML = '';

      const localOption = document.createElement('option');
      localOption.value = 'local';
      localOption.textContent = '本机模拟采集（未连接硬件）';
      deviceSelect.appendChild(localOption);

      authorizedUsbDevices.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = `usb-${index}`;
        option.textContent = usbDeviceLabel(device, index);
        deviceSelect.appendChild(option);
      });

      if (preferredDevice) {
        const index = authorizedUsbDevices.indexOf(preferredDevice);
        if (index >= 0) {
          deviceSelect.value = `usb-${index}`;
          selectedUsbDevice = preferredDevice;
          selectedDeviceMode = 'usb';
          return;
        }
      }

      if (previousValue.startsWith('usb-')) {
        const index = Number(previousValue.replace('usb-', ''));
        if (Number.isInteger(index) && authorizedUsbDevices[index]) {
          deviceSelect.value = previousValue;
          selectedUsbDevice = authorizedUsbDevices[index];
          selectedDeviceMode = 'usb';
          return;
        }
      }

      deviceSelect.value = 'local';
      selectedUsbDevice = null;
      selectedDeviceMode = 'local';
    }

    async function loadAuthorizedUsbDevices() {
      if (!('usb' in navigator)) return;

      try {
        authorizedUsbDevices = await navigator.usb.getDevices();
        rebuildDeviceOptions();

        if (authorizedUsbDevices.length > 0) {
          setDeviceMessage(
            `已发现 ${authorizedUsbDevices.length} 个曾授权的USB设备，可从下拉框选择。`,
            'success'
          );
        }
      } catch (error) {
        console.warn('读取已授权USB设备失败：', error);
      }
    }

    async function chooseUsbDevice() {
      if (!('usb' in navigator)) {
        setDeviceMessage('当前浏览器不支持USB设备选择。', 'error');
        return;
      }

      if (radarCaptureRunning) {
        setDeviceMessage('请先结束当前采集，再切换设备。', 'warning');
        return;
      }

      chooseDeviceBtn.disabled = true;
      chooseDeviceBtn.textContent = '等待选择...';

      try {
        // 不限定 VID/PID，让用户从浏览器允许访问的 USB 设备中选择。
        const device = await navigator.usb.requestDevice({ filters: [] });

        if (!authorizedUsbDevices.includes(device)) {
          authorizedUsbDevices.push(device);
        }

        rebuildDeviceOptions(device);
        const label = usbDeviceLabel(device, authorizedUsbDevices.indexOf(device));
        setDeviceMessage(`已选择：${label}`, 'success');
        appendLog(`采集设备已切换为：${label}`);
      } catch (error) {
        if (error?.name === 'NotFoundError') {
          setDeviceMessage('未选择设备，继续使用原来的采集设备。', 'warning');
        } else if (error?.name === 'SecurityError') {
          setDeviceMessage('浏览器拒绝访问该USB设备，请检查HTTPS环境、设备驱动或浏览器权限。', 'error');
        } else {
          console.error(error);
          setDeviceMessage(`USB设备选择失败：${error?.message || '未知错误'}`, 'error');
        }
      } finally {
        chooseDeviceBtn.disabled = false;
        chooseDeviceBtn.textContent = '选择USB设备';
      }
    }

    function handleDeviceSelectionChange() {
      if (radarCaptureRunning) {
        setDeviceMessage('采集过程中不能切换设备，请先结束采集。', 'warning');
        return;
      }

      const value = deviceSelect.value;
      if (value === 'local') {
        selectedDeviceMode = 'local';
        selectedUsbDevice = null;
        setDeviceMessage('当前使用本机模拟采集，不会直接读取毫米波雷达USB数据。');
        appendLog('采集设备已切换为：本机模拟采集。');
        return;
      }

      const index = Number(value.replace('usb-', ''));
      const device = authorizedUsbDevices[index];

      if (!device) {
        deviceSelect.value = 'local';
        selectedDeviceMode = 'local';
        selectedUsbDevice = null;
        setDeviceMessage('所选USB设备不可用，已切换为本机模拟采集。', 'error');
        return;
      }

      selectedDeviceMode = 'usb';
      selectedUsbDevice = device;
      const label = usbDeviceLabel(device, index);
      setDeviceMessage(`当前采集设备：${label}`, 'success');
      appendLog(`采集设备已切换为：${label}`);
    }

    function currentDeviceLabel() {
      if (selectedDeviceMode === 'usb' && selectedUsbDevice) {
        const index = authorizedUsbDevices.indexOf(selectedUsbDevice);
        return usbDeviceLabel(selectedUsbDevice, Math.max(0, index));
      }
      return '本机模拟采集';
    }

    function formatRadarElapsed(totalSeconds) {
      const seconds = Math.max(0, Math.floor(totalSeconds));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      if (hours > 0) {
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateRadarElapsed() {
      if (!radarCaptureRunning) return;
      radarElapsedSeconds = Math.floor((Date.now() - radarCaptureStartTime) / 1000);
      radarCountdown.textContent = formatRadarElapsed(radarElapsedSeconds);
    }

    function resetRadarCapture() {
      if (radarCaptureTimer !== null) {
        clearInterval(radarCaptureTimer);
        radarCaptureTimer = null;
      }

      radarCaptureRunning = false;
      radarCaptureFinished = false;
      radarCaptureStartTime = 0;
      radarElapsedSeconds = 0;
      deviceSelect.disabled = false;
      chooseDeviceBtn.disabled = !('usb' in navigator);

      radarCaptureBtn.disabled = false;
      radarCaptureBtn.classList.remove('collecting', 'complete');
      radarCaptureBtn.textContent = '开始毫米波雷达信号采集';

      radarStatus.classList.remove('collecting', 'complete');
      radarStatusText.textContent = '等待开始采集';
      radarCountdown.textContent = '00:00';
      radarProgressBar.style.width = '0%';
    }

    function finishRadarCapture() {
      if (!radarCaptureRunning) return;

      updateRadarElapsed();

      if (radarCaptureTimer !== null) {
        clearInterval(radarCaptureTimer);
        radarCaptureTimer = null;
      }

      radarCaptureRunning = false;
      radarCaptureFinished = true;
      deviceSelect.disabled = false;
      chooseDeviceBtn.disabled = !('usb' in navigator);

      radarCaptureBtn.disabled = false;
      radarCaptureBtn.classList.remove('collecting');
      radarCaptureBtn.classList.add('complete');
      radarCaptureBtn.textContent = '重新采集';

      radarStatus.classList.remove('collecting');
      radarStatus.classList.add('complete');
      radarStatusText.textContent = '采集结束，文件已上传至系统';
      radarCountdown.textContent = formatRadarElapsed(radarElapsedSeconds);
      radarProgressBar.style.width = '100%';

      appendLog(`毫米波雷达信号采集结束，设备：${currentDeviceLabel()}，采集时长 ${formatRadarElapsed(radarElapsedSeconds)}，文件已上传至系统。`);
    }

    function startRadarCapture() {
      // 采集中再次点击，即由用户手动结束采集
      if (radarCaptureRunning) {
        finishRadarCapture();
        return;
      }

      // 已完成后再次点击，直接开始新一轮采集
      if (radarCaptureFinished) {
        resetRadarCapture();
      }

      radarCaptureRunning = true;
      radarCaptureFinished = false;
      radarCaptureStartTime = Date.now();
      deviceSelect.disabled = true;
      chooseDeviceBtn.disabled = true;
      radarElapsedSeconds = 0;

      radarCaptureBtn.disabled = false;
      radarCaptureBtn.classList.add('collecting');
      radarCaptureBtn.classList.remove('complete');
      radarCaptureBtn.textContent = '结束毫米波雷达信号采集';

      radarStatus.classList.add('collecting');
      radarStatus.classList.remove('complete');
      radarStatusText.textContent = '正在采集毫米波雷达信号';
      radarCountdown.textContent = '00:00';
      radarProgressBar.style.width = '34%';

      appendLog(`毫米波雷达信号采集已开始，设备：${currentDeviceLabel()}。请在采集完成后点击“结束毫米波雷达信号采集”。`);

      radarCaptureTimer = setInterval(updateRadarElapsed, 250);
    }

    function setResult(type, content) {
      resultBox.classList.remove('normal', 'fatigue');
      if (type) resultBox.classList.add(type);
      if (typeof content === 'string' && content.trim().startsWith('<')) {
        resultBox.innerHTML = content;
      } else {
        resultBox.textContent = content;
      }
      resultBox.scrollTop = 0;
      if (type === 'fatigue') app.classList.add('alert');
      else app.classList.remove('alert');
    }

    function escapeHTML(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function setPlaceholders(show) {
      [ph1, ph2, ph3].forEach(ph => ph.style.display = show ? 'flex' : 'none');
    }

    function normalizeArray(arr) {
      const clean = (arr || []).filter(v => Number.isFinite(v));
      if (!clean.length) return [];
      const sorted = clean.slice().sort((a, b) => a - b);
      const q1 = sorted[Math.floor(sorted.length * 0.05)] ?? sorted[0];
      const q2 = sorted[Math.floor(sorted.length * 0.95)] ?? sorted[sorted.length - 1];
      const min = Math.min(q1, q2);
      const max = Math.max(q1, q2);
      if (Math.abs(max - min) < 1e-6) return arr.map(() => 0.5);
      return arr.map(v => clamp((v - min) / (max - min), 0, 1));
    }

    function resampleArray(arr, targetLen = DISPLAY_POINTS) {
      if (!arr || !arr.length) return [];
      if (arr.length === targetLen) return arr.slice();
      if (arr.length === 1) return Array.from({ length: targetLen }, () => arr[0]);
      const out = [];
      for (let i = 0; i < targetLen; i++) {
        const x = (i / (targetLen - 1)) * (arr.length - 1);
        const x0 = Math.floor(x);
        const x1 = Math.min(arr.length - 1, Math.ceil(x));
        const t = x - x0;
        out.push(arr[x0] * (1 - t) + arr[x1] * t);
      }
      return out;
    }

    function splitCSVRow(row) {
      const cells = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < row.length; i++) {
        const ch = row[i];
        if (ch === '"') {
          if (inQuotes && row[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          cells.push(cur.trim());
          cur = '';
        } else {
          cur += ch;
        }
      }
      cells.push(cur.trim());
      return cells;
    }

    function normalizeHeaderName(name) {
      return String(name || '')
        .replace(/^\uFEFF/, '')
        .trim()
        .toLowerCase()
        .replace(/[\s_\-\/\\()（）\[\]【】{}:：.]/g, '');
    }

    function parseNumberCell(value) {
      if (value === null || value === undefined) return NaN;
      const s = String(value)
        .replace(/^\uFEFF/, '')
        .replace(/%/g, '')
        .replace(/，/g, ',')
        .replace(/,/g, '')
        .trim();
      if (!s || /^nan$/i.test(s) || /^null$/i.test(s) || /^undefined$/i.test(s)) return NaN;
      const n = Number(s);
      return Number.isFinite(n) ? n : NaN;
    }

    function findColumn(headers, exactKeys, containsKeys = []) {
      const normalized = headers.map(normalizeHeaderName);
      const exactSet = exactKeys.map(normalizeHeaderName);
      for (const key of exactSet) {
        const idx = normalized.indexOf(key);
        if (idx >= 0) return idx;
      }
      const containsSet = containsKeys.map(normalizeHeaderName).filter(Boolean);
      for (let i = 0; i < normalized.length; i++) {
        const h = normalized[i];
        if (containsSet.some(k => h.includes(k))) return i;
      }
      return -1;
    }

    function median(arr) {
      const clean = (arr || []).filter(v => Number.isFinite(v)).sort((a, b) => a - b);
      if (!clean.length) return 0;
      const mid = Math.floor(clean.length / 2);
      return clean.length % 2 ? clean[mid] : (clean[mid - 1] + clean[mid]) / 2;
    }

    function movingAverage(arr, win) {
      if (!arr || !arr.length) return [];
      const w = Math.max(1, Math.floor(win));
      const half = Math.floor(w / 2);
      const out = new Array(arr.length);
      let sum = 0;
      let count = 0;
      let left = 0;
      let right = -1;
      for (let i = 0; i < arr.length; i++) {
        const targetRight = Math.min(arr.length - 1, i + half);
        while (right < targetRight) {
          right++;
          if (Number.isFinite(arr[right])) {
            sum += arr[right];
            count++;
          }
        }
        while (left < i - half) {
          if (Number.isFinite(arr[left])) {
            sum -= arr[left];
            count--;
          }
          left++;
        }
        out[i] = count > 0 ? sum / count : 0;
      }
      return out;
    }

    function inferSamplingRate(timestamps) {
      if (!timestamps || timestamps.length < 3) return DEFAULT_RAW_PPG_FS;
      const diffs = [];
      for (let i = 1; i < timestamps.length; i++) {
        const d = timestamps[i] - timestamps[i - 1];
        if (Number.isFinite(d) && d > 0) diffs.push(d);
      }
      const md = median(diffs);
      if (!md) return DEFAULT_RAW_PPG_FS;
      if (md > 10) return clamp(1000 / md, 1, 500);
      return clamp(1 / md, 1, 500);
    }

    function detectPeaks(arr, fs, minDistanceSec = 0.35) {
      if (!arr || arr.length < 3) return [];
      const m = mean(arr);
      const s = std(arr) || 1;
      const threshold = m + 0.25 * s;
      const minDistance = Math.max(1, Math.floor(fs * minDistanceSec));
      const peaks = [];
      let lastPeak = -Infinity;
      for (let i = 1; i < arr.length - 1; i++) {
        if (arr[i] > threshold && arr[i] >= arr[i - 1] && arr[i] > arr[i + 1]) {
          if (i - lastPeak >= minDistance) {
            peaks.push(i);
            lastPeak = i;
          } else if (peaks.length && arr[i] > arr[peaks[peaks.length - 1]]) {
            peaks[peaks.length - 1] = i;
            lastPeak = i;
          }
        }
      }
      return peaks;
    }

    function deriveFromRawPPG(ppg, timestamps) {
      const samples = (ppg || []).filter(v => Number.isFinite(v));
      if (samples.length < 10) return { heart: [], rr: [], breathing: [] };
      const fs = inferSamplingRate(timestamps);
      const baseline = movingAverage(samples, Math.max(3, Math.round(fs * 0.8)));
      const detrended = samples.map((v, i) => v - baseline[i]);
      const smooth = movingAverage(detrended, Math.max(3, Math.round(fs * 0.12)));
      const totalWindow = Math.max(Math.round(WINDOW_SECONDS * fs), Math.min(samples.length, Math.round(20 * fs)));
      const step = Math.max(1, Math.round(STEP_SECONDS * fs));
      const heart = [];
      const rr = [];
      const breathing = [];

      for (let start = 0; start < smooth.length; start += step) {
        const end = Math.min(smooth.length, start + totalWindow);
        const win = smooth.slice(start, end);
        if (win.length < Math.max(10, fs * 5)) break;

        const peaks = detectPeaks(win, fs, 0.32);
        const rrIntervals = [];
        for (let i = 1; i < peaks.length; i++) {
          const intervalMs = ((peaks[i] - peaks[i - 1]) / fs) * 1000;
          if (intervalMs >= 350 && intervalMs <= 1800) rrIntervals.push(intervalMs);
        }

        const rrMean = mean(rrIntervals);
        rr.push(rrMean || NaN);
        heart.push(rrMean ? 60000 / rrMean : NaN);

        const respTrace = movingAverage(win, Math.max(3, Math.round(fs * 1.8)));
        const respPeaks = detectPeaks(respTrace, fs, 1.6);
        const durationMin = win.length / fs / 60;
        const respRate = durationMin > 0 ? respPeaks.length / durationMin : NaN;
        breathing.push(Number.isFinite(respRate) ? clamp(respRate, 4, 35) : NaN);

        if (end >= smooth.length) break;
      }

      return {
        heart: heart.filter(Number.isFinite),
        rr: rr.filter(Number.isFinite),
        breathing: breathing.filter(Number.isFinite)
      };
    }

    function parseCSV(text) {
      const clean = String(text || '').replace(/\r/g, '').trim();
      const lines = clean.split('\n').filter(l => l.trim() !== '');
      if (!lines.length) return null;

      const rows = lines.map(splitCSVRow);
      const first = rows[0].map(v => v.replace(/^\uFEFF/, '').trim());
      const hasHeader = first.some(h => !Number.isFinite(parseNumberCell(h)));
      const headers = hasHeader ? first : first.map((_, i) => `col_${i + 1}`);
      const startRow = hasHeader ? 1 : 0;

      const idxTime = findColumn(headers, ['timeStamp', 'timestamp', 'time', '时间', '采样时间'], ['time', '时间']);
      const idxHeart = findColumn(headers, ['HR_PPG', 'hrppg', 'heart_rate', 'heartrate', 'heart', 'hr', '心率'], ['hrppg', 'heartrate', '心率']);
      const idxRr = findColumn(headers, ['IBI_PPG', 'ibi_ppg', 'RR_PPG', 'RRInterval', 'RR_Interval', 'RRI', 'RR', 'IBI', 'rr间隔', 'rr间期'], ['ibippg', 'rrinterval', 'rr间隔', 'rr间期']);
      const idxBreathing = findColumn(headers, ['Resp', 'respiration', 'breathing', 'breath', '呼吸', '呼吸率', '呼吸生理信号'], ['resp', 'respiration', 'breathing', '呼吸']);
      const idxSdnn = findColumn(headers, ['SDNN_PPG', 'SDNN', 'sdnnppg'], ['sdnn']);
      const idxRmssd = findColumn(headers, ['RMSSD_PPG', 'RMSSD', 'rmssdppg'], ['rmssd']);
      const idxPnn50 = findColumn(headers, ['pN50_PPG', 'PNN50', 'pnn50', 'pN50'], ['pnn50', 'pn50']);
      const idxQuality = findColumn(headers, ['Quality_PPG', 'Quality_Peak', 'quality', 'signalquality', '信号质量'], ['quality', '质量']);
      const idxRawPPG = findColumn(headers, ['PPG', 'raw_PPG', 'rawPPG', 'PPG_signal', 'BVP', 'greenPPG', 'redPPG', 'irPPG', '原始PPG'], ['rawppg', 'ppgsignal', '原始ppg']);

      const heart = [];
      const rr = [];
      const breathing = [];
      const sdnn = [];
      const rmssd = [];
      const pnn50 = [];
      const quality = [];
      const timestamps = [];
      const rawPPG = [];

      function pushByIndex(row, idx, out) {
        if (idx < 0) return;
        const n = parseNumberCell(row[idx]);
        if (Number.isFinite(n)) out.push(n);
      }

      for (let i = startRow; i < rows.length; i++) {
        const row = rows[i];
        if (!row || !row.length) continue;

        if (hasHeader) {
          pushByIndex(row, idxTime, timestamps);
          pushByIndex(row, idxHeart, heart);
          pushByIndex(row, idxRr, rr);
          pushByIndex(row, idxBreathing, breathing);
          pushByIndex(row, idxSdnn, sdnn);
          pushByIndex(row, idxRmssd, rmssd);
          pushByIndex(row, idxPnn50, pnn50);
          pushByIndex(row, idxQuality, quality);
          pushByIndex(row, idxRawPPG, rawPPG);
        } else {
          const nums = row.map(parseNumberCell).filter(v => Number.isFinite(v));
          if (nums.length === 1) rawPPG.push(nums[0]);
          else if (nums.length >= 4) {
            timestamps.push(nums[0]);
            heart.push(nums[1]);
            rr.push(nums[2]);
            breathing.push(nums[3]);
          } else if (nums.length >= 3) {
            heart.push(nums[0]);
            rr.push(nums[1]);
            breathing.push(nums[2]);
          }
        }
      }

      let mode = 'feature';
      let derived = { heart: [], rr: [], breathing: [] };
      if ((!heart.length || !rr.length || !breathing.length) && rawPPG.length) {
        derived = deriveFromRawPPG(rawPPG, timestamps);
        mode = 'raw_ppg';
      }

      const finalHeart = heart.length ? heart : derived.heart;
      const finalRr = rr.length ? rr : derived.rr;
      const finalBreathing = breathing.length ? breathing : derived.breathing;

      if (finalRr.length && median(finalRr) < 20 && median(finalRr) > 0) {
        for (let i = 0; i < finalRr.length; i++) finalRr[i] *= 1000;
      }

      if (!finalRr.length && finalHeart.length) {
        finalHeart.forEach(h => {
          if (h > 0) finalRr.push(60000 / h);
        });
      }

      if (!finalHeart.length && finalRr.length) {
        finalRr.forEach(r => {
          if (r > 0) finalHeart.push(60000 / r);
        });
      }

      const cleanHeart = finalHeart.filter(Number.isFinite);
      const cleanRr = finalRr.filter(Number.isFinite);
      const cleanBreathing = finalBreathing.filter(Number.isFinite);

      const derivedFlags = {
        sdnn: false,
        rmssd: false,
        quality: false,
        breathingRelative: cleanBreathing.length > 0 && mean(cleanBreathing) > 0 && mean(cleanBreathing) < 5
      };

      let finalSdnn = sdnn.filter(Number.isFinite);
      let finalRmssd = rmssd.filter(Number.isFinite);
      let finalQuality = quality.filter(Number.isFinite);

      // 当输入文件没有 SDNN / RMSSD 时，基于 RR 间隔序列进行兜底估算。
      // 若 RR 是逐窗口均值，该结果是“趋势估计值”，用于前端展示和规则判断，不等同于逐搏 HRV 金标准。
      if (!finalSdnn.length && cleanRr.length >= 2) {
        finalSdnn = [std(cleanRr)];
        derivedFlags.sdnn = true;
      }

      if (!finalRmssd.length && cleanRr.length >= 2) {
        finalRmssd = [rmssdFromRr(cleanRr)];
        derivedFlags.rmssd = true;
      }

      if (!finalQuality.length && (cleanHeart.length || cleanRr.length || cleanBreathing.length)) {
        finalQuality = [estimateSignalQuality(cleanHeart, cleanRr, cleanBreathing)];
        derivedFlags.quality = true;
      }

      return {
        heart: cleanHeart,
        rr: cleanRr,
        breathing: cleanBreathing,
        sdnn: finalSdnn,
        rmssd: finalRmssd,
        pnn50,
        quality: finalQuality,
        timestamps,
        rawPPG,
        rowCount: Math.max(0, rows.length - startRow),
        mode,
        derivedFlags,
        sourceColumns: {
          heart: idxHeart >= 0 ? headers[idxHeart] : (derived.heart.length ? '原始PPG估算' : ''),
          rr: idxRr >= 0 ? headers[idxRr] : (derived.rr.length ? '原始PPG峰值估算' : ''),
          breathing: idxBreathing >= 0 ? headers[idxBreathing] : (derived.breathing.length ? '原始PPG低频估算' : ''),
          sdnn: idxSdnn >= 0 ? headers[idxSdnn] : (derivedFlags.sdnn ? 'RR间隔估算' : ''),
          rmssd: idxRmssd >= 0 ? headers[idxRmssd] : (derivedFlags.rmssd ? 'RR间隔估算' : ''),
          quality: idxQuality >= 0 ? headers[idxQuality] : (derivedFlags.quality ? '完整性/稳定性估算' : ''),
          rawPPG: idxRawPPG >= 0 ? headers[idxRawPPG] : '',
          time: idxTime >= 0 ? headers[idxTime] : ''
        }
      };
    }

    function smoothSeries(arr, passes = 1) {
      let out = arr.slice();
      for (let p = 0; p < passes; p++) {
        const next = [];
        for (let i = 0; i < out.length; i++) {
          const a = out[(i - 1 + out.length) % out.length];
          const b = out[i];
          const c = out[(i + 1) % out.length];
          next.push((a + 2 * b + c) / 4);
        }
        out = next;
      }
      return out;
    }

    function buildSineSeries(values, type, seed) {
      const clean = (values || []).filter(v => Number.isFinite(v));
      if (!clean.length) return [];

      const rand = mulberry32(seed || 1);
      const normalized = normalizeArray(clean);
      let envelope = resampleArray(normalized.length ? normalized : [0.5], DISPLAY_POINTS);
      envelope = smoothSeries(smoothSeries(smoothSeries(envelope, 1), 1), 1);

      const avg = mean(clean);
      let cycles;
      let amp;
      let harmonic;
      let phase = rand();

      if (type === 'breathing') {
        // Resp 为每分钟呼吸频率。60s 窗口内的周期数约等于 Resp 本身。
        cycles = clamp(avg || 12, 6, 18);
        amp = 0.255;
        harmonic = 0.05;
      } else if (type === 'heart') {
        // HR_PPG 是心率特征趋势，不是原始脉搏波。为避免 60s 内 60~100 个周期过密，按可视化比例压缩。
        cycles = clamp((avg || 70) / 7.2, 7, 13);
        amp = 0.215;
        harmonic = 0.04;
      } else {
        // RR 间隔与心率相反，显示为平滑节律趋势。
        const hrEstimate = avg > 0 ? 60000 / avg : 70;
        cycles = clamp(hrEstimate / 7.5, 6, 12);
        amp = 0.225;
        harmonic = 0.045;
      }

      const out = [];
      let theta = Math.PI * 2 * phase;
      const baseStep = (Math.PI * 2 * cycles) / DISPLAY_POINTS;

      for (let i = 0; i < DISPLAY_POINTS; i++) {
        const env = envelope[i] - 0.5;
        const freqMod = 1 + env * (type === 'breathing' ? 0.18 : 0.10);
        const ampMod = 1 + env * (type === 'breathing' ? 0.32 : 0.24);
        theta += baseStep * clamp(freqMod, 0.82, 1.22);

        const s1 = Math.sin(theta);
        const s2 = Math.sin(theta * 2 + Math.PI / 5) * harmonic;
        const drift = env * (type === 'breathing' ? 0.055 : 0.035);
        const micro = (rand() - 0.5) * 0.004;
        out.push(clamp(0.5 + amp * ampMod * (s1 + s2) + drift + micro, 0.06, 0.94));
      }

      return smoothSeries(out, 2);
    }

    function buildFallbackSine(stage, seed, type) {
      const profiles = {
        running: { breathing: 13, heart: 72, rr: 835 },
        normal: { breathing: 12, heart: 70, rr: 860 },
        fatigue: { breathing: 16, heart: 92, rr: 650 }
      };
      const p = profiles[stage] || profiles.running;
      const base = p[type] || p.heart;
      const vals = Array.from({ length: 60 }, (_, i) => {
        const t = i / 59;
        const wiggle = Math.sin(Math.PI * 2 * (2.3 * t + 0.11)) * base * 0.025;
        return base + wiggle;
      });
      return buildSineSeries(vals, type, seed);
    }

    function generateWaveforms(stage, seed) {
      return {
        breathing: buildFallbackSine(stage, seed + 11, 'breathing'),
        heart: buildFallbackSine(stage, seed + 23, 'heart'),
        rr: buildFallbackSine(stage, seed + 37, 'rr')
      };
    }

    function sourceSummary() {
      const s = rawCsvData.sourceColumns || {};
      const parts = [];
      if (s.heart) parts.push(`心率=${s.heart}`);
      if (s.rr) parts.push(`RR间隔=${s.rr}`);
      if (s.breathing) parts.push(`呼吸=${s.breathing}`);
      if (s.sdnn) parts.push(`SDNN=${s.sdnn}`);
      if (s.rmssd) parts.push(`RMSSD=${s.rmssd}`);
      if (s.quality) parts.push(`质量=${s.quality}`);
      return parts.join('，') || '未识别到标准列，已使用模拟波形兜底';
    }

    async function loadFileAsWaveData(file) {
      if (!file) {
        waveformData = generateWaveforms(currentStage, currentSeed);
        rawCsvData = emptyRawData();
        return;
      }

      const text = await file.text();
      const parsed = parseCSV(text);

      if (!parsed || (!parsed.heart.length && !parsed.rr.length && !parsed.breathing.length)) {
        waveformData = generateWaveforms(currentStage, hashString(file.name + '|' + text.slice(0, 200)));
        rawCsvData = emptyRawData();
        rawCsvData.rowCount = parsed ? parsed.rowCount : 0;
        return;
      }

      rawCsvData = {
        heart: parsed.heart.length ? parsed.heart : [],
        rr: parsed.rr.length ? parsed.rr : [],
        breathing: parsed.breathing.length ? parsed.breathing : [],
        sdnn: parsed.sdnn || [],
        rmssd: parsed.rmssd || [],
        pnn50: parsed.pnn50 || [],
        quality: parsed.quality || [],
        timestamps: parsed.timestamps || [],
        rawPPG: parsed.rawPPG || [],
        sourceColumns: parsed.sourceColumns || {},
        derivedFlags: parsed.derivedFlags || { sdnn: false, rmssd: false, quality: false, breathingRelative: false },
        rowCount: parsed.rowCount || 0,
        mode: parsed.mode || 'feature'
      };

      const heartBase = parsed.heart.length ? parsed.heart : parsed.rr.map(v => v > 0 ? 60000 / v : NaN).filter(Number.isFinite);
      const rrBase = parsed.rr.length ? parsed.rr : parsed.heart.map(v => v > 0 ? 60000 / v : NaN).filter(Number.isFinite);
      const breathingBase = parsed.breathing.length ? parsed.breathing : [];
      const fallback = generateWaveforms(currentStage, currentSeed);

      waveformData = {
        heart: heartBase.length ? buildSineSeries(heartBase, 'heart', currentSeed + 101) : fallback.heart,
        rr: rrBase.length ? buildSineSeries(rrBase, 'rr', currentSeed + 202) : fallback.rr,
        breathing: breathingBase.length ? buildSineSeries(breathingBase, 'breathing', currentSeed + 303) : fallback.breathing
      };
    }

    function drawWave(canvas, data, color, amplitudeScale, offset, mode) {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, w, h);
      if (!data || !data.length) return;

      const len = data.length;
      const padX = 6;
      const minX = padX;
      const maxX = w - padX;
      const mid = h * 0.52;
      const safeTopBottom = 8;
      const usableHalfHeight = (h * 0.5) - safeTopBottom;

      const smoothData = [];
      for (let i = 0; i < len; i++) {
        const a = data[(i - 2 + len) % len];
        const b = data[(i - 1 + len) % len];
        const c = data[i];
        const d = data[(i + 1) % len];
        const e = data[(i + 2) % len];
        smoothData.push((a + 2 * b + 3 * c + 2 * d + e) / 9);
      }

      const center = 0.50;
      const maxDev = Math.max(...smoothData.map(v => Math.abs(v - center))) || 1;
      const autoScale = (usableHalfHeight / maxDev) * 0.90;
      const lineBoost = mode === 'breathing' ? 1.00 : mode === 'heart' ? 0.96 : 0.98;

      ctx.save();
      ctx.lineWidth = 2.0;
      ctx.strokeStyle = color;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();

      const visibleCount = Math.max(2, Math.floor(len * waveReveal));

      for (let i = 0; i < visibleCount; i++) {
        const x = minX + (i / (len - 1)) * (maxX - minX);
        const idx = (i + offset) % len;
        const v = smoothData[idx];

        let y = mid - (v - center) * amplitudeScale * lineBoost * autoScale;
        y = clamp(y, safeTopBottom, h - safeTopBottom);

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.stroke();
      ctx.restore();
    }

    function drawAll() {
      drawWave(canvas1, waveformData.breathing, '#bb4d4d', 1.18, frameIndex * 1, 'breathing');
      drawWave(canvas2, waveformData.heart, '#222222', 1.34, frameIndex * 2, 'heart');
      drawWave(canvas3, waveformData.rr, '#8e67cb', 1.22, frameIndex * 1, 'rr');
    }

    function animate(ts) {
      if (!showWaveforms) {
        stopAnimate();
        return;
      }

      if (!lastAnimTime) lastAnimTime = ts;
      const dt = ts - lastAnimTime;
      lastAnimTime = ts;

      scrollAcc += dt * (SCROLL_SPEED / 1000);
      while (scrollAcc >= 1) {
        frameIndex = (frameIndex + 1) % DISPLAY_POINTS;
        scrollAcc -= 1;
      }

      drawAll();
      animId = requestAnimationFrame(animate);
    }

    function startAnimate() {
      if (animId !== null) return;
      lastAnimTime = 0;
      scrollAcc = 0;
      animId = requestAnimationFrame(animate);
    }

    function stopAnimate() {
      if (animId !== null) {
        cancelAnimationFrame(animId);
        animId = null;
      }
      lastAnimTime = 0;
      scrollAcc = 0;
    }

    function mean(arr) {
      const clean = (arr || []).filter(v => Number.isFinite(v));
      if (!clean.length) return 0;
      return clean.reduce((a, b) => a + b, 0) / clean.length;
    }

    function std(arr) {
      const clean = (arr || []).filter(v => Number.isFinite(v));
      if (!clean.length) return 0;
      const m = mean(clean);
      return Math.sqrt(clean.reduce((s, x) => s + Math.pow(x - m, 2), 0) / clean.length);
    }

    function finiteArray(arr) {
      return (arr || []).filter(v => Number.isFinite(v));
    }

    function rmssdFromRr(rrArr) {
      const rr = finiteArray(rrArr);
      if (rr.length < 2) return 0;
      const diffs = [];
      for (let i = 1; i < rr.length; i++) {
        const d = rr[i] - rr[i - 1];
        if (Number.isFinite(d)) diffs.push(d);
      }
      if (!diffs.length) return 0;
      return Math.sqrt(diffs.reduce((s, d) => s + d * d, 0) / diffs.length);
    }

    function proportionInRange(arr, minV, maxV) {
      const clean = finiteArray(arr);
      if (!clean.length) return 0;
      const ok = clean.filter(v => v >= minV && v <= maxV).length;
      return ok / clean.length;
    }

    function estimateSignalQuality(heartArr, rrArr, breathingArr) {
      const heart = finiteArray(heartArr);
      const rr = finiteArray(rrArr);
      const breathing = finiteArray(breathingArr);
      const maxLen = Math.max(heart.length, rr.length, breathing.length, 1);
      const completeness = (
        Math.min(heart.length / maxLen, 1) +
        Math.min(rr.length / maxLen, 1) +
        Math.min(breathing.length / maxLen, 1)
      ) / 3;

      const heartRange = heart.length ? proportionInRange(heart, 40, 140) : 0;
      const rrRange = rr.length ? proportionInRange(rr, 300, 1800) : 0;
      const bMean = mean(breathing);
      const breathingRelative = breathing.length && bMean > 0 && bMean < 5;
      const breathingRange = breathing.length
        ? (breathingRelative ? proportionInRange(breathing, -5, 5) : proportionInRange(breathing, 6, 35))
        : 0;
      const rangeScore = (heartRange + rrRange + breathingRange) / 3;

      const heartStability = heart.length ? clamp(1 - std(heart) / 25, 0, 1) : 0;
      const rrStability = rr.length ? clamp(1 - std(rr) / 220, 0, 1) : 0;
      const breathingStability = breathing.length
        ? (breathingRelative ? clamp(1 - std(breathing) / 0.25, 0, 1) : clamp(1 - std(breathing) / 10, 0, 1))
        : 0;
      const stability = (heartStability + rrStability + breathingStability) / 3;

      return clamp(0.20 + completeness * 0.35 + rangeScore * 0.25 + stability * 0.20, 0, 1);
    }

    function fmt(value, digits = 2, fallback = '--') {
      return Number.isFinite(value) && value !== 0 ? value.toFixed(digits) : fallback;
    }

    function metricCard(name, value, unit = '') {
      return `
        <div class="metric-item">
          <div class="metric-name">${escapeHTML(name)}</div>
          <div class="metric-value">${escapeHTML(value)}${unit ? ` <span>${escapeHTML(unit)}</span>` : ''}</div>
        </div>`;
    }

    function buildResultHTML(result) {
      const { fatigue, confidence, fatigueScore, riskScore, reasons, lowQuality, metrics } = result;
      const reasonText = reasons.length ? reasons.join('；') : '主要生理指标处于相对稳定范围';
      const status = fatigue ? '疲劳状态' : '正常状态';
      const advice = fatigue ? '系统提示：已触发红色预警，请立即休息。' : '系统提示：当前状态正常，可继续监测。';
      const qualityNote = lowQuality ? '<div class="result-note">注意：信号质量偏低，建议重新采集或检查佩戴状态。</div>' : '';
      const derived = metrics.derivedFlags || {};
      const derivedTexts = [];
      if (derived.sdnn) derivedTexts.push('SDNN由RR间隔估算');
      if (derived.rmssd) derivedTexts.push('RMSSD由RR间隔估算');
      if (derived.quality) derivedTexts.push('质量均值由数据完整性和稳定性估算');
      const derivedNote = derivedTexts.length ? `<div class="result-note">补充说明：${escapeHTML(derivedTexts.join('；'))}。</div>` : '';
      const breathingName = derived.breathingRelative ? '呼吸信号均值 / 波动' : '呼吸均值 / 波动';
      const breathingUnit = derived.breathingRelative ? '' : '次/分';

      return `
        <div class="result-head">
          <span class="status-pill ${fatigue ? 'bad' : 'good'}">${status}</span>
          <div class="confidence">
            置信度 ${confidence.toFixed(2)}%<br>
            疲劳评分 ${fatigueScore}/10
            <span class="confidence-note">风险指数 ${(riskScore * 100).toFixed(1)}%</span>
          </div>
        </div>
        <div class="metric-grid">
          ${metricCard('心率均值 / 波动', `${fmt(metrics.heartMean)} / ${fmt(metrics.heartStd)}`, 'bpm')}
          ${metricCard('RR间隔均值 / 波动', `${fmt(metrics.rrMean)} / ${fmt(metrics.rrStd)}`, 'ms')}
          ${metricCard(breathingName, `${fmt(metrics.breathingMean)} / ${fmt(metrics.breathingStd)}`, breathingUnit)}
          ${metricCard('SDNN / RMSSD', `${fmt(metrics.sdnnMean)} / ${fmt(metrics.rmssdMean)}`, 'ms')}
          ${metricCard('质量均值', fmt(metrics.qualityMean, 3), '')}
          ${metricCard('有效窗口', `${metrics.validWindows}`, '个')}
        </div>
        <div class="result-reason"><b>判别依据：</b>${escapeHTML(reasonText)}</div>
        <div class="result-advice">${escapeHTML(advice)}</div>
        ${qualityNote}
        ${derivedNote}`;
    }

    function bandRisk(value, normalLow, normalHigh, severeLow, severeHigh) {
      if (!Number.isFinite(value) || value === 0) return null;
      if (value >= normalLow && value <= normalHigh) return 0;
      if (value < normalLow) return clamp((normalLow - value) / Math.max(1e-6, normalLow - severeLow), 0, 1);
      return clamp((value - normalHigh) / Math.max(1e-6, severeHigh - normalHigh), 0, 1);
    }

    function lowRisk(value, normalMin, severeMin) {
      if (!Number.isFinite(value) || value === 0) return null;
      if (value >= normalMin) return 0;
      return clamp((normalMin - value) / Math.max(1e-6, normalMin - severeMin), 0, 1);
    }

    function highRisk(value, normalMax, severeMax) {
      if (!Number.isFinite(value) || value === 0) return null;
      if (value <= normalMax) return 0;
      return clamp((value - normalMax) / Math.max(1e-6, severeMax - normalMax), 0, 1);
    }

    function addWeightedRisk(items, risk, weight) {
      if (risk === null) return;
      items.push({ risk: clamp(risk, 0, 1), weight });
    }

    function calcRiskScore(metrics, lowQuality) {
      const items = [];
      addWeightedRisk(items, bandRisk(metrics.heartMean, 55, 85, 45, 105), 1.20);
      addWeightedRisk(items, bandRisk(metrics.rrMean, 720, 1050, 550, 1250), 1.15);
      if (!metrics.derivedFlags || !metrics.derivedFlags.breathingRelative) {
        addWeightedRisk(items, bandRisk(metrics.breathingMean, 12, 20, 8, 26), 1.00);
      } else {
        addWeightedRisk(items, highRisk(metrics.breathingStd, 0.08, 0.25), 0.45);
      }
      addWeightedRisk(items, lowRisk(metrics.sdnnMean, 45, 20), 0.90);
      addWeightedRisk(items, lowRisk(metrics.rmssdMean, 35, 15), 0.90);
      addWeightedRisk(items, highRisk(metrics.heartStd, 5, 15), 0.45);
      addWeightedRisk(items, highRisk(metrics.rrStd, 50, 120), 0.45);
      addWeightedRisk(items, highRisk(metrics.breathingStd, 2, 7), 0.45);
      if (metrics.qualityMean > 0) {
        addWeightedRisk(items, lowRisk(metrics.qualityMean, 0.45, 0.15), 0.55);
      }
      if (lowQuality) addWeightedRisk(items, 1, 0.35);

      if (!items.length) return 0.50;
      const weightSum = items.reduce((s, item) => s + item.weight, 0);
      const riskSum = items.reduce((s, item) => s + item.risk * item.weight, 0);
      return clamp(riskSum / weightSum, 0, 1);
    }

    function calcConfidence(metrics, riskScore, fatigue, lowQuality) {
      // 置信度不是模型 softmax。这里用“距离判别边界 + 数据完整度 + 信号质量 + 生理稳定性”估计。
      const boundary = 0.55;
      const distance = fatigue ? Math.max(0, riskScore - boundary) / (1 - boundary) : Math.max(0, boundary - riskScore) / boundary;
      const validSignals = [metrics.heartMean, metrics.rrMean, metrics.breathingMean, metrics.sdnnMean, metrics.rmssdMean]
        .filter(v => Number.isFinite(v) && v !== 0).length;
      const completeness = validSignals / 5;
      const breathingScale = metrics.derivedFlags && metrics.derivedFlags.breathingRelative ? 0.25 : 8;
      const stability = clamp(
        1
        - clamp(metrics.heartStd / 18, 0, 1) * 0.34
        - clamp(metrics.rrStd / 140, 0, 1) * 0.34
        - clamp(metrics.breathingStd / breathingScale, 0, 1) * 0.32,
        0,
        1
      );
      const quality = metrics.qualityMean > 0 ? clamp(metrics.qualityMean / 0.65, 0, 1) : 0.75;
      const qualityPenalty = lowQuality ? 8 : 0;

      return clamp(
        58 + distance * 25 + completeness * 6 + stability * 7 + quality * 4 - qualityPenalty,
        60,
        99
      );
    }

    function chooseResultFromData() {
      const heartArr = rawCsvData.heart.length ? rawCsvData.heart : [];
      const rrArr = rawCsvData.rr.length ? rawCsvData.rr : [];
      const breathingArr = rawCsvData.breathing.length ? rawCsvData.breathing : [];
      const sdnnArr = rawCsvData.sdnn || [];
      const rmssdArr = rawCsvData.rmssd || [];
      const qualityArr = rawCsvData.quality || [];

      const metrics = {
        heartMean: mean(heartArr),
        heartStd: std(heartArr),
        rrMean: mean(rrArr),
        rrStd: std(rrArr),
        breathingMean: mean(breathingArr),
        breathingStd: std(breathingArr),
        sdnnMean: mean(sdnnArr),
        rmssdMean: mean(rmssdArr),
        qualityMean: mean(qualityArr),
        validWindows: Math.max(heartArr.length, rrArr.length, breathingArr.length),
        derivedFlags: rawCsvData.derivedFlags || { sdnn: false, rmssd: false, quality: false, breathingRelative: false }
      };

      let fatigueScore = 0;
      const reasons = [];

      if (metrics.heartMean) {
        if (metrics.heartMean >= 95 || metrics.heartMean < 50) {
          fatigueScore += 2;
          reasons.push('心率均值明显偏离正常静息范围');
        } else if (metrics.heartMean >= 85 || metrics.heartMean < 55) {
          fatigueScore += 1;
          reasons.push('心率均值轻度异常');
        }
      }

      if (metrics.rrMean) {
        if (metrics.rrMean <= 630 || metrics.rrMean >= 1150) {
          fatigueScore += 2;
          reasons.push('RR间隔均值明显异常');
        } else if (metrics.rrMean <= 720 || metrics.rrMean >= 1050) {
          fatigueScore += 1;
          reasons.push('RR间隔均值轻度异常');
        }
      }

      if (metrics.breathingMean) {
        if (metrics.derivedFlags && metrics.derivedFlags.breathingRelative) {
          if (metrics.breathingStd > 0.12) {
            fatigueScore += 1;
            reasons.push('呼吸信号波动偏大');
          }
        } else if (metrics.breathingMean < 10 || metrics.breathingMean > 22) {
          fatigueScore += 2;
          reasons.push('呼吸频率明显异常');
        } else if (metrics.breathingMean < 12 || metrics.breathingMean > 20) {
          fatigueScore += 1;
          reasons.push('呼吸频率轻度异常');
        }
      }

      if (metrics.sdnnMean) {
        if (metrics.sdnnMean < 30) {
          fatigueScore += 2;
          reasons.push('SDNN偏低，心率变异性下降');
        } else if (metrics.sdnnMean < 45) {
          fatigueScore += 1;
          reasons.push('SDNN轻度偏低');
        }
      }

      if (metrics.rmssdMean) {
        if (metrics.rmssdMean < 25) {
          fatigueScore += 2;
          reasons.push('RMSSD偏低，副交感调节减弱');
        } else if (metrics.rmssdMean < 35) {
          fatigueScore += 1;
          reasons.push('RMSSD轻度偏低');
        }
      }

      if (metrics.heartStd > 8) {
        fatigueScore += 1;
        reasons.push('心率波动偏大');
      }
      if (metrics.rrStd > 90) {
        fatigueScore += 1;
        reasons.push('RR间隔波动偏大');
      }
      const breathingStdLimit = metrics.derivedFlags && metrics.derivedFlags.breathingRelative ? 0.12 : 5;
      if (metrics.breathingStd > breathingStdLimit) {
        fatigueScore += 1;
        reasons.push(metrics.derivedFlags && metrics.derivedFlags.breathingRelative ? '呼吸信号波动偏大' : '呼吸波动偏大');
      }

      const lowQuality = metrics.qualityMean > 0 && metrics.qualityMean < 0.20;
      const riskScore = calcRiskScore(metrics, lowQuality);
      const fatigue = fatigueScore >= 4 || riskScore >= 0.55;
      const confidence = calcConfidence(metrics, riskScore, fatigue, lowQuality);

      return {
        fatigue,
        confidence,
        fatigueScore,
        riskScore,
        reasons,
        lowQuality,
        metrics
      };
    }

    function applyStage(stage) {
      currentStage = stage;
      waveformData = generateWaveforms(stage, currentSeed);
      if (showWaveforms) {
        resizeAll();
        drawAll();
      }
    }

    async function startDetection() {
      if (detectionRunning) return;

      const file = fileInput.files[0];
      if (!file) {
        alert('请先上传 CSV 文件后再开始检测。');
        return;
      }

      detectionRunning = true;
      startBtn.disabled = true;
      resetBtn.disabled = true;
      refreshBtn.disabled = true;
      setProgress(0);
      setPlaceholders(true);
      showWaveforms = false;
      waveReveal = 0;

      clearInterval(progressTimer);
      clearInterval(revealTimer);
      clearTimeout(finalTimer);
      clearTimeout(waveTimer);

      try {
        const model = modelSelect.value;
        setLogs([
          `已选择模型：${model}`,
          `已上传文件：${file.name}`,
          `窗口设置：${WINDOW_SECONDS}s 窗长 / ${STEP_SECONDS}s 步长`,
          '正在运行：读取 CSV 数据......',
          '正在运行：解析 PPG 心率 / RR 间隔 / 呼吸特征......',
          '正在运行：生成三类波形图数据......',
          '正在运行：疲劳状态预测......'
        ]);
        setResult('', '正在检测中，请稍候...');

        currentSeed = hashString(file.name + '|' + file.size + '|' + file.lastModified + '|' + model);
        applyStage('running');
        await loadFileAsWaveData(file);
        resizeAll();
        appendLog(`已识别字段：${sourceSummary()}`);
        appendLog(`有效数据窗口：${Math.max(rawCsvData.heart.length, rawCsvData.rr.length, rawCsvData.breathing.length)} 个`);

        const start = performance.now();

        progressTimer = setInterval(() => {
          const elapsed = performance.now() - start;
          const x = clamp(elapsed / DETECT_DURATION, 0, 1);
          const eased = x < 0.5
            ? 4 * x * x * x
            : 1 - Math.pow(-2 * x + 2, 3) / 2;
          setProgress(Math.round(eased * 100));
        }, 60);

        waveTimer = setTimeout(() => {
          showWaveforms = true;
          setPlaceholders(false);
          currentStage = 'running';
          resizeAll();
          frameIndex = 0;
          waveReveal = 0;
          drawAll();
          startAnimate();
          appendLog('波形已开始输出：呼吸 / 心率 / RR间隔准正弦波。');

          const revealStart = performance.now();
          revealTimer = setInterval(() => {
            const elapsed = performance.now() - revealStart;
            const p = clamp(elapsed / WAVE_REVEAL_DURATION, 0, 1);
            waveReveal = p * p * (3 - 2 * p);
            if (p >= 1) {
              clearInterval(revealTimer);
              revealTimer = null;
              waveReveal = 1;
            }
          }, 40);
        }, WAVE_DELAY);

        finalTimer = setTimeout(() => {
          clearInterval(progressTimer);
          progressTimer = null;
          clearTimeout(waveTimer);
          clearInterval(revealTimer);
          revealTimer = null;

          setProgress(100);
          waveReveal = 1;

          const result = chooseResultFromData();
          const { fatigue } = result;
          const finalText = buildResultHTML(result);

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              if (fatigue) {
                appendLog('处理完成：检测结果为【疲劳状态】');
                setResult('fatigue', finalText);
              } else {
                appendLog('处理完成：检测结果为【正常状态】');
                setResult('normal', finalText);
              }

              showWaveforms = true;
              setPlaceholders(false);

              detectionRunning = false;
              startBtn.disabled = false;
              resetBtn.disabled = false;
              refreshBtn.disabled = false;
            });
          });
        }, DETECT_DURATION);

      } catch (err) {
        console.error(err);
        stopAnimate();
        clearInterval(progressTimer);
        clearInterval(revealTimer);
        clearTimeout(finalTimer);
        clearTimeout(waveTimer);
        showWaveforms = false;
        detectionRunning = false;
        startBtn.disabled = false;
        resetBtn.disabled = false;
        refreshBtn.disabled = false;
        setResult('fatigue', '检测过程出错，请打开浏览器控制台查看报错信息。\n\n请检查 CSV 格式，或使用 HR_PPG / IBI_PPG / Resp 等列名。');
      }
    }

    function resetAll() {
      stopAnimate();
      clearInterval(progressTimer);
      clearInterval(revealTimer);
      clearTimeout(finalTimer);
      clearTimeout(waveTimer);
      resetRadarCapture();

      detectionRunning = false;
      showWaveforms = false;
      frameIndex = 0;
      waveReveal = 0;
      currentStage = 'running';
      app.classList.remove('alert');
      setProgress(0);
      setPlaceholders(true);
      setLogs(['请先选择模型并上传 CSV 文件，然后点击“开始检测”。']);
      setResult('', '等待检测结果...');
      startBtn.disabled = false;
      resetBtn.disabled = false;
      refreshBtn.disabled = false;
      fileInput.value = '';
      currentSeed = 123456;
      rawCsvData = emptyRawData();
      waveformData = generateWaveforms('running', currentSeed);
      resizeAll();
      canvases.forEach(c => c.getContext('2d').clearRect(0, 0, c.width, c.height));
    }

    function refreshWave() {
      const file = fileInput.files[0];
      currentSeed = hashString((file ? file.name : 'nofile') + '|' + modelSelect.value + '|' + Date.now());
      waveformData = generateWaveforms(currentStage, currentSeed);

      if (file) {
        loadFileAsWaveData(file).then(() => {
          if (showWaveforms) {
            setPlaceholders(false);
            requestAnimationFrame(() => {
              drawAll();
            });
          }
          appendLog(`已刷新波形图。字段：${sourceSummary()}`);
        });
      } else {
        if (showWaveforms) {
          setPlaceholders(false);
          requestAnimationFrame(() => {
            drawAll();
          });
        }
        appendLog('已刷新波形图。');
      }
    }

    startBtn.addEventListener('click', startDetection);
    resetBtn.addEventListener('click', resetAll);
    refreshBtn.addEventListener('click', refreshWave);
    radarCaptureBtn.addEventListener('click', startRadarCapture);
    chooseDeviceBtn.addEventListener('click', chooseUsbDevice);
    deviceSelect.addEventListener('change', handleDeviceSelectionChange);

    if ('usb' in navigator) {
      navigator.usb.addEventListener('connect', loadAuthorizedUsbDevices);
      navigator.usb.addEventListener('disconnect', async (event) => {
        await loadAuthorizedUsbDevices();

        if (selectedUsbDevice && event.device === selectedUsbDevice) {
          selectedUsbDevice = null;
          selectedDeviceMode = 'local';
          rebuildDeviceOptions();
          setDeviceMessage('USB设备已断开，已切换为本机模拟采集。', 'warning');
          appendLog('USB采集设备已断开，系统已切换为本机模拟采集。');
        }
      });
    }

    modelSelect.addEventListener('change', () => {
      appendLog(`模型切换为：${modelSelect.value}`);
    });

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      currentSeed = hashString(file.name + '|' + file.size + '|' + file.lastModified + '|' + modelSelect.value);
      await loadFileAsWaveData(file);
      appendLog(`已加载文件：${file.name}`);
      appendLog(`已识别字段：${sourceSummary()}`);
      setResult('', 'CSV 文件已就绪，点击“开始检测”即可。');
      if (showWaveforms) drawAll();
    });

    waveformData = generateWaveforms('running', currentSeed);
    resizeAll();
    setPlaceholders(true);
    initUsbSupport();
    resetRadarCapture();
    loadAuthorizedUsbDevices();

  </script>
</body>
</html>
